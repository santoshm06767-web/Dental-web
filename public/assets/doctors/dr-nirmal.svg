<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="nirmal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="shirt-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="skin-nirmal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8bd90"/>
      <stop offset="100%" stop-color="#d19c6d"/>
    </linearGradient>
    <linearGradient id="hair-nirmal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231f20"/>
      <stop offset="100%" stop-color="#121011"/>
    </linearGradient>
    <pattern id="stripe-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="2" y1="0" x2="2" y2="8" stroke="#38bdf8" stroke-width="0.9" opacity="0.45"/>
    </pattern>
    <clipPath id="circle-clip-nirmal">
      <circle cx="128" cy="128" r="124" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-nirmal)">
    <!-- Background -->
    <rect width="256" height="256" fill="url(#nirmal-bg)"/>
    <circle cx="128" cy="115" r="90" fill="#ffffff" opacity="0.5" />

    <!-- Shoulders / Torso with Light Blue Striped Dress Shirt -->
    <path d="M30 256 C36 210 75 186 128 186 C181 186 220 210 226 256 Z" fill="url(#shirt-blue)"/>
    <path d="M30 256 C36 210 75 186 128 186 C181 186 220 210 226 256 Z" fill="url(#stripe-pattern)"/>

    <!-- Placket & Buttons -->
    <path d="M122 205 L134 205 L134 256 L122 256 Z" fill="#ffffff" opacity="0.9"/>
    <line x1="128" y1="205" x2="128" y2="256" stroke="#93c5fd" stroke-width="1"/>
    <circle cx="128" cy="220" r="2.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
    <circle cx="128" cy="242" r="2.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>

    <!-- Formal Collars matching photo -->
    <path d="M78 206 L118 190 L112 230 L70 216 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M178 206 L138 190 L144 230 L186 216 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Neck -->
    <path d="M108 140 C108 175 148 175 148 140 L148 196 C138 202 118 202 108 196 Z" fill="url(#skin-nirmal)"/>
    <path d="M108 152 C120 166 136 166 148 152 C148 168 136 174 128 174 C120 174 108 168 108 152 Z" fill="#ba8657"/>

    <!-- Ears -->
    <path d="M76 106 C72 106 70 124 74 132 C78 138 82 136 82 126 Z" fill="url(#skin-nirmal)"/>
    <path d="M180 106 C184 106 186 124 182 132 C178 138 174 136 174 126 Z" fill="url(#skin-nirmal)"/>

    <!-- Face (Mature dignified structure) -->
    <path d="M82 96 C82 58 174 58 174 96 C174 138 160 170 128 174 C96 170 82 138 82 96 Z" fill="url(#skin-nirmal)"/>

    <!-- Forehead / expression lines -->
    <path d="M108 82 C120 80 136 80 148 82" stroke="#ba8657" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Eyebrows (composed, natural) -->
    <path d="M95 98 C104 95 114 96 120 100" stroke="#1f1814" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M161 98 C152 95 142 96 136 100" stroke="#1f1814" stroke-width="3.2" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Mature, calm, focused gaze) -->
    <ellipse cx="108" cy="110" rx="6.5" ry="4.5" fill="#ffffff"/>
    <ellipse cx="148" cy="110" rx="6.5" ry="4.5" fill="#ffffff"/>
    <circle cx="108" cy="110" r="3.4" fill="#1c1917"/>
    <circle cx="148" cy="110" r="3.4" fill="#1c1917"/>
    <circle cx="106.5" cy="108.5" r="1.2" fill="#ffffff"/>
    <circle cx="146.5" cy="108.5" r="1.2" fill="#ffffff"/>
    <!-- Gentle lower-eye character folds -->
    <path d="M102 116 C108 119 114 118 116 116" stroke="#ba8657" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M140 116 C142 118 148 119 154 116" stroke="#ba8657" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- Characteristic mark near left eye as in photo -->
    <circle cx="158" cy="114" r="1.3" fill="#6c4228"/>

    <!-- Nose -->
    <path d="M128 106 L125 132 C121 133 123 136 128 136 C133 136 135 133 131 132" stroke="#b47e50" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Composed mouth with gentle dignified smile -->
    <path d="M112 148 C120 152 136 152 144 148" stroke="#944f2d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M116 154 C122 157 134 157 140 154" stroke="#ba8657" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Short neat black hair with slight side volume matching photo -->
    <path d="M78 94 C78 48 102 38 128 38 C154 38 178 48 178 94 C178 104 174 110 172 108 C170 85 168 64 158 56 C148 48 132 46 124 47 C112 48 98 55 90 68 C84 78 84 94 82 108 C80 108 78 102 78 94 Z" fill="url(#hair-nirmal)"/>
    <!-- Subtle natural hair texture -->
    <path d="M106 48 C116 43 132 43 144 48" stroke="#373133" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M84 78 C88 68 96 60 106 55" stroke="#2d2729" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Gold Clinic Director Crest / Badge -->
    <rect x="66" y="222" width="30" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="81" y="234" font-family="sans-serif" font-size="8" font-weight="bold" fill="#fef08a" text-anchor="middle">ADMIN</text>
  </g>
  <!-- Outer border ring with gold accent for Clinic Director -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.85"/>
</svg>
